name: TrackLead Automated Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-freeze-lockfile

      - name: Run Vitest Unit & Integration Tests
        run: pnpm test run

      - name: Verify TypeScript Compilation & Next Build
        run: pnpm build
